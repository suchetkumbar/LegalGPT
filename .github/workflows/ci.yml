name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Includes the row-level security tests, which apply the real migration
      # files to an in-process Postgres. No database or API keys are needed.
      - name: Test
        run: npm run test

      # Rule-based evaluations, no model calls. Fails if a metric drops more
      # than 3 points below evals/baseline.json.
      - name: Evaluation gate
        run: npm run eval:gate

      - name: Format
        run: npm run format:check
